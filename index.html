<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctrine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Doctrine</h1>
    <button id="end-turn">End turn</button>
    <button id="new-game">New game</button>
    <span id="turn"></span>
  </header>
  <main>
    <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-label="Hex map"></svg>
    <div id="status"></div>
    <div id="order" hidden>
      <p id="order-text"></p>
      <button id="end-order">Cancel order</button>
    </div>
    <div class="hand-title" id="hand-title"></div>
    <div id="hand"></div>
  </main>
  <aside>
    <h2>Selection</h2>
    <div id="info"></div>
    <div id="decision" hidden>
      <p id="decision-text"></p>
      <button id="hold">Hold (lose 2 men)</button>
    </div>
    <h2>Terrain</h2>
    <div class="legend">
      <span class="swatch open"></span><span>Open</span>
      <span class="swatch rough"></span><span>Rough</span>
      <span class="swatch fortified"></span><span>Fortified</span>
    </div>
    <h2>Log</h2>
    <ol id="log" reversed></ol>
  </aside>
  <script type="module" src="js/main.js"></script>
</body>
</html>
